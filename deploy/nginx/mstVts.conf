server {
    listen 80;
    server_name mstechind.com www.mstechind.com;

    client_max_body_size 20M;

    # ACME challenge for certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/laravel/mstVts/public;
    index index.php index.html;

    # Main route block — pass everything to Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handler
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny .env for security
    location ~ /\.env {
        deny all;
    }
}

server {
    listen 443 ssl http2;
    server_name mstechind.com www.mstechind.com;

    ssl_certificate     /etc/ssl/mstechind/fullchain.pem;
    ssl_certificate_key /etc/ssl/mstechind/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    root /var/www/laravel/mstVts/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.env {
        deny all;
    }
}
