services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nexus_fleet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # localhost only — reached by the backend container over the compose network
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      # localhost only — the PM2 GPS ingest (e101-tcp) connects via 127.0.0.1:6379
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # localhost only — host nginx proxies /api and /socket.io here
      - "127.0.0.1:4000:4000"
    environment:
      DB_TYPE: postgres
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-nexus_fleet}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-nexus_fleet}
      PORT: 4000
      CORS_ORIGINS: http://localhost:3000,http://localhost,http://147.93.31.140,http://mstechind.com,https://mstechind.com,https://admin.mstechind.com
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_TWO_FACTOR_SECRET: ${JWT_TWO_FACTOR_SECRET:-change-me-2fa}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      JWT_TWO_FACTOR_EXPIRES_IN: 5m
      OTP_EXPIRES_IN_SECONDS: 300
      OTP_RESEND_COOLDOWN_SECONDS: 30
      AUTO_SEED: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nexus.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      DEFAULT_TENANT_NAME: Nexus HQ
      DEFAULT_TENANT_SLUG: nexus
      DEMO_TENANT_NAME: Acme Corp
      DEMO_TENANT_SLUG: acme
      AUDIT_LOG_RETENTION_DAYS: 90
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      OSRM_URL: http://osrm:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      # localhost only — host nginx proxies tenant subdomains here
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: /
    depends_on:
      - backend

  # Reverse proxy (80/443) runs on the HOST as a systemd service so it can share
  # the box with the Laravel mstVts site at mstechind.com. Do not re-add a
  # containerised nginx here — it cannot bind ports that the host nginx owns.

  tcp-server:
    build:
      context: ./tcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    # GPS ingest currently runs on the host under PM2 (/var/www/node/e101-tcp-server)
    # because it owns port 20000. Enable this profile only after stopping PM2.
    profiles: ["docker-ingest"]
    ports:
      - "20000:20000"
    environment:
      TCP_PORT: 20000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    depends_on:
      redis:
        condition: service_healthy

  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm=mld /data/fleet-area.osrm
    mem_limit: 2g

volumes:
  postgres_data:
  redis_data:
